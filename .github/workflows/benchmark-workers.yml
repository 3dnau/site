name: Isolated Workers assets direct-upload benchmark
on:
  push:
    branches: [benchmark/workers-vs-actions]
permissions:
  contents: read
concurrency:
  group: isolated-workers-benchmark
  cancel-in-progress: false
jobs:
  build-deploy:
    if: github.repository == '3dnau/site' && github.ref == 'refs/heads/benchmark/workers-vs-actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Restore isolated npm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.npm
          key: workers-actions-resume-20261013-v1-npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Restore isolated Hugo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .cache
          key: workers-actions-resume-20261013-v1-hugo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: workers-actions-resume-20261013-v1-hugo-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Install pinned Hugo Extended
        run: |
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/hugo.tar.gz" https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          mkdir -p "$RUNNER_TEMP/hugo-bin"
          tar -xzf "$RUNNER_TEMP/hugo.tar.gz" -C "$RUNNER_TEMP/hugo-bin" hugo
          echo "$RUNNER_TEMP/hugo-bin" >> "$GITHUB_PATH"
      - name: Build identical pinned source
        run: sh scripts/benchmark-build.sh
      - name: Direct upload assets with pinned Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_3DNAU_BENCHMARK_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 2a60adb835beed5a921c5471ac7906e3
        run: npx --yes wrangler@4.46.0 deploy --config wrangler-workers.json
