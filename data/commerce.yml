# Política de totales (servidor). Fuente: correo de Saray del 12/11/2026.
# - Envío a península y Baleares: 6 € fijos con IVA incluido (21 %).
# - Más de 2 kg o más de una unidad → presupuesto.
# - Canarias (35, 38), Ceuta (51) y Melilla (52) → presupuesto en el lanzamiento.
totals_policy:
  version: 3dnau-2026-11-12
  destinations:
    ES:
      tax: { mode: inclusive, rate_percent: 21 }
      excluded_postal_prefixes: ['35', '38', '51', '52']
      shipping:
        amount: 6
        tax: { mode: inclusive, rate_percent: 21 }
        max_weight_kg: 2
        max_units: 1
# Botón «Solicitar presupuesto» junto al aviso del carrito.
cart_quote: true
notes:
  product: "Precio con IVA incluido. Envío a península y Baleares: 6 € IVA incluido (una unidad de hasta 2 kg). Fabricamos cada pedido."
  cart: "Canarias, Ceuta, Melilla, otros países, varias unidades o más de 2 kg: [pide presupuesto](/#contacto) y te lo enviamos. Al pagar aceptas las [condiciones de venta](/condiciones-de-venta/)."
# Plazos de conservación: PROPUESTA pendiente de que Saray fije su política.
privacy_retention:
  orders: "6 años (Código de Comercio y normativa fiscal)"
  delivery: "3 años desde la entrega (garantía legal)"
  contacts: "Hasta que te des de baja o retires el permiso; revisamos la lista cada 2 años"
# Borrado automático de dirección y contacto de entrega (días): DESACTIVADO por decisión de Loren (2026-11-11), por defecto no se borra nada.
# Solo si la normativa lo exige: activar con un valor que coincida con privacy_retention.delivery.
# delivery_retention_days: 1095
order_notices:
  enabled: true
  buyer_invoice: on_request   # Saray (2026-11-13): casilla «Quiero recibir la factura»; ella recibe siempre todas
audience:                # Saray (2026-11-13): casilla opcional de promociones; lista en Brevo
  enabled: true
  customers: false       # quien compra sin marcar la casilla no entra en la lista
  consent_version: promo-2026-11-14
  consent_text:
    es: "Acepto recibir promociones y novedades de 3DNAU"
  provider: "Brevo (Sendinblue SAS, Francia)"
checkout_tax_id: true   # Saray (2026-11-13): NIF/CIF opcional; con NIF «FACTURA», sin NIF «FACTURA SIMPLIFICADA» (invoice.simplified, por defecto con language: es)
