[build]
publish = "public"
command = "sh do hugo"

[build.environment]
PNPM_FLAGS = "--frozen-lockfile --config.enable-global-virtual-store=false"
HUGO_VERSION = "0.164.0"
NODE_VERSION = "23.5.0"

[context.production]
publish = "public"
command = "sh do hugo"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
